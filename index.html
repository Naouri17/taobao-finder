<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>1688 Finder — Product Search</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c222b;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:26px 22px 55px}.brand{font-size:20px;font-weight:850;display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;background:#e65336;color:#fff;width:38px;height:38px;border-radius:12px}.hero{text-align:center;padding:72px 0 40px}.eyebrow{color:#e65336;text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:800}.hero h1{font-size:clamp(34px,6vw,56px);letter-spacing:-1.7px;line-height:1.1;margin:12px 0}.hero p{color:#66717f;max-width:550px;margin:0 auto}.search{display:flex;max-width:760px;gap:9px;padding:9px;margin:26px auto;background:#fff;border:1px solid #dfe4ea;border-radius:16px;box-shadow:0 12px 32px #0000000a}.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;padding:12px}.btn{background:#e65336;color:#fff;border:0;border-radius:11px;padding:12px 23px;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.6}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.chips button{border:1px solid #dfe4ea;border-radius:99px;background:#fff;padding:7px 13px;cursor:pointer;color:#596678}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px}.head h2{font-size:20px;margin:0}.muted{color:#66717f;font-size:13px}.status{padding:28px 16px;border:1px dashed #dfe4ea;border-radius:14px;background:#fff;color:#66717f;text-align:center}.status strong{display:block;color:#1c222b;margin-bottom:5px}.status a{display:inline-block;margin-top:10px;color:#d94e32;font-weight:700}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.product{overflow:hidden;background:#fff;border:1px solid #e2e6ec;border-radius:14px;text-decoration:none;color:#1c222b}.product img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f1f2f4}.details{padding:12px}.title{font-size:14px;line-height:1.4;height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.price{font-size:19px;font-weight:850;color:#e65336;margin-top:9px}.morebox{text-align:center;padding:25px}footer{text-align:center;color:#7a8491;font-size:12px;margin-top:50px}@media(max-width:850px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:18px 13px}.hero{padding:52px 0 30px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.search{gap:4px}.search input{padding:10px 6px}.btn{padding:10px 14px}.details{padding:9px}}
</style></head><body><main class="wrap"><header class="brand"><span class="logo">1688</span><span>Product Finder</span></header><section class="hero"><div class="eyebrow">Chinese wholesale search</div><h1>Find the products you need.</h1><p>Search in English or Chinese and browse product images, names and prices from 1688.</p><form class="search" id="form"><input id="keyword" type="search" required placeholder="Try 劳保手套 or work gloves" aria-label="Product keyword"><button class="btn" id="submit">Search →</button></form><div class="chips"><button data-q="劳保手套">Work gloves</button><button data-q="女包">Women's bags</button><button data-q="运动鞋">Sneakers</button><button data-q="家居灯具">Home lighting</button></div></section><section aria-live="polite"><div class="head"><h2 id="heading">Product results</h2><span class="muted" id="meta"></span></div><div id="content"><div class="status"><strong>Ready to search</strong>Enter a product name above to begin.</div></div><div class="morebox"><button class="btn" id="more" hidden>Load more</button></div></section><footer>Independent product search · Not affiliated with 1688 or Soorce</footer></main><script src="./config.js"></script><script>
const $=id=>document.getElementById(id),form=$('form'),input=$('keyword'),content=$('content'),more=$('more'),submit=$('submit');let page=1,query='',busy=false,total=0;const base=String(window.PRODUCT_API_BASE||'').replace(/\/$/,'');function showError(title,msg){content.innerHTML='';const d=document.createElement('div');d.className='status';const b=document.createElement('strong');b.textContent=title;d.append(b,document.createTextNode(msg));const a=document.createElement('a');a.href='https://s.1688.com/selloffer/offer_search.htm?keywords='+encodeURIComponent(query);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open 1688 search ↗';d.append(document.createElement('br'),a);content.append(d)}function render(items,append){if(!append){content.innerHTML='';const g=document.createElement('div');g.className='products';g.id='products';content.append(g)}const grid=$('products');for(const p of items){if(!p.title||!p.image||!p.url)continue;const a=document.createElement('a');a.className='product';a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.loading='lazy';img.referrerPolicy='no-referrer';img.src=p.image;img.alt=p.title;const d=document.createElement('div');d.className='details';const t=document.createElement('div');t.className='title';t.textContent=p.title;d.append(t);if(p.price!==null&&p.price!==undefined&&Number.isFinite(Number(p.price))){const price=document.createElement('div');price.className='price';price.textContent=(p.currency||'¥')+Number(p.price).toLocaleString('en-US');d.append(price)}a.append(img,d);grid.append(a)}}async function search(append=false){if(busy)return;if(!base){showError('Search service not configured','The page is published, but the secure 1688 search backend still needs to be deployed and connected.');return}busy=true;submit.disabled=true;more.disabled=true;more.hidden=true;if(!append){page=1;content.innerHTML='<div class="status"><strong>Searching 1688…</strong>Retrieving product listings.</div>';$('heading').textContent='Results for “'+query+'”';$('meta').textContent=''}try{const u=new URL(base+'/api/search');u.searchParams.set('keyword',query);u.searchParams.set('page',page);u.searchParams.set('page_size',20);const r=await fetch(u,{headers:{Accept:'application/json'}});const data=await r.json();if(!r.ok||data.code!==200)throw Error(data.msg||'Product provider unavailable');const items=data.data?.items||[];total=Number(data.data?.total_count)||0;if(!items.length&&!append){showError('No products found','Try another keyword, or open the 1688 search page.')}else render(items,append);$('meta').textContent=total?total.toLocaleString()+' results':'';more.hidden=!data.data?.has_next_page&&!((page*20)<total)}catch(e){if(!append)showError('Could not load products',e.message||'The 1688 search service is unavailable.')}finally{busy=false;submit.disabled=false;more.disabled=false}}form.addEventListener('submit',e=>{e.preventDefault();query=input.value.trim();if(!query)return;history.replaceState(null,'','?keyword='+encodeURIComponent(query));search()});more.addEventListener('click',()=>{page++;search(true)});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.q;form.requestSubmit()}));const initial=new URLSearchParams(location.search).get('keyword');if(initial){input.value=initial;form.requestSubmit()}
</script></body></html>
